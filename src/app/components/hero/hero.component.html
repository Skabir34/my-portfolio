<section class="hero">
  <div class="hero-bg" aria-hidden="true">
    <div class="grid-line grid-v1"></div>
    <div class="grid-line grid-v2"></div>
    <div class="glow"></div>
  </div>

  <div class="wrap hero-inner">
    <p class="eyebrow reveal-in">Hi, I'm</p>
    <h1 class="reveal-in name">SHAIKH MOHAMMED<br />SHAHRUKH</h1>
    <p class="role-line reveal-in"><b>{{ contact.role }}</b> · Frontend Engineer · FinTech / BFSI</p>
    <p class="headline reveal-in">{{ hero.headline }}</p>
    <p class="sub reveal-in">{{ hero.sub }}</p>

    <div class="cta-row reveal-in">
      <a href="#project" class="btn btn-primary">View Projects</a>
      <a
        [href]="contact.cvPath"
        [download]="contact.cvFileName"
        class="btn btn-ghost"
      >Download CV</a>
      <a [href]="contact.cvPath" target="_blank" rel="noopener" class="btn btn-ghost btn-subtle">View CV</a>
    </div>

    <div class="meta-row reveal-in">
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6">
          <path d="M16 3H8a2 2 0 0 0-2 2v14l6-3 6 3V5a2 2 0 0 0-2-2z" />
        </svg>
        <a [href]="contact.linkedin" target="_blank" rel="noopener">LinkedIn</a>
      </div>
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 7l9 6 9-6" />
        </svg>
        <a [href]="'mailto:' + contact.email">{{ contact.email }}</a>
      </div>
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2
            19.79 19.79 0 0 1-8.63-3.07
            19.5 19.5 0 0 1-6-6
            19.79 19.79 0 0 1-3.07-8.67
            A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
            12.84 12.84 0 0 0 .7 2.81
            2 2 0 0 1-.45 2.11L8.09 9.91
            a16 16 0 0 0 6 6l1.27-1.27
            a2 2 0 0 1 2.11-.45
            12.84 12.84 0 0 0 2.81.7
            A2 2 0 0 1 22 16.92z" />
        </svg>
        <a [href]="'tel:' + contact.phone">{{ contact.phone }}</a>
      </div>
      <div class="meta-item">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6">
          <path d="M12 21s7-7.4 7-12a7 7 0 1 0-14 0c0 4.6 7 12 7 12z" />
          <circle cx="12" cy="9" r="2.4" />
        </svg>
        <span>{{ contact.location }}</span>
      </div>
    </div>
  </div>

  <div class="scroll-cue reveal-in"><span>SCROLL</span><span class="line"></span></div>
</section>

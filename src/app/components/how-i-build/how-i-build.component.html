<section class="section-pad">
  <div class="wrap">
    <div class="sec-head" appRevealOnScroll>
      <p class="eyebrow">Philosophy</p>
      <h2>How I build</h2>
    </div>

    <div class="build-grid">
      @for (item of principles; track item.number) {
        <div class="build-cell" appRevealOnScroll>
          <div class="b-num">{{ item.number }}</div>
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
        </div>
      }
    </div>
  </div>
</section>
